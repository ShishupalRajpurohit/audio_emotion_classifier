version: '3.8'

services:
  audio-emotion-classifier:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: audio-emotion-classifier-api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - LOG_LEVEL=INFO
    env_file:
      - .env
    volumes:
      # Mount static files for development
      - ./static:/app/static
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=10)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M  # Much smaller due to API-only approach
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'

networks:
  default:
    driver: bridge